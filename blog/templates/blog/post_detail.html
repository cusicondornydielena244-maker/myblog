{% extends 'blog/base.html' %}

{% block content %}
<style>
    .blog-post-container {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #333;
        line-height: 1.6;
    }

    .post-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        margin-bottom: 40px;
        border: 1px solid #eaeaea;
    }

    /* Стили для баннера */
    .banner-wrapper {
        width: 100%;
        max-height: 400px;
        overflow: hidden;
        background: #f1f5f9;
    }

    .banner {
        width: 100%;
        height: auto;
        object-fit: cover;
        display: block;
    }

    /* Контент внутри карточки поста */
    .post-content-inner {
        padding: 40px;
    }

    .post-date {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 12px;
        display: inline-block;
    }

    .post-title {
        font-size: 2.2rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-top: 0;
        margin-bottom: 24px;
        line-height: 1.3;
    }

    .post-text {
        font-size: 1.05rem;
        color: #4a4a4a;
    }

    .post-text p {
        margin-bottom: 1.5em;
    }

    /* Тонкий разделитель перед футером или другими блоками */
    .custom-divider {
        border: 0;
        height: 1px;
        background: #eaeaea;
        margin: 40px 0;
    }
</style>

<div class="blog-post-container">
    
    <article class="post-card">
        <!-- Баннер статьи (если он загружен) -->
        {% if post.banner %}
            <div class="banner-wrapper">
                <img src="{{ post.banner.url }}" alt="{{ post.title }}" class="banner">
            </div>
        {% endif %}

        <div class="post-content-inner">
            <!-- Дата (если есть в модели) -->
            {% if post.published_date %}
                <span class="post-date">{{ post.published_date|date:"d M Y, H:i" }}</span>
            {% endif %}
            
            <!-- Заголовок -->
            <h2 class="post-title">{{ post.title }}</h2>
            
            <!-- Текст статьи -->
            <div class="post-text">
                {{ post.text|linebreaksbr }}
            </div>
        </div>
    </article>

    <hr class="custom-divider">

</div>
{% endblock %}
